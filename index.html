<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日晨報 Daily Market Report</title>
  <meta name="description" content="每日美股市場晨報與研究整理" />
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
    .wrap{max-width:820px;margin:auto;padding:20px 16px 48px}.hero{padding:28px 22px;background:linear-gradient(135deg,#111827,#243b67);color:#fff;border-radius:20px;margin-bottom:18px}
    h1{font-size:30px;line-height:1.2;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}.sub{opacity:.82;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(15,23,42,.05)}
    a{color:var(--accent);text-decoration:none}.report{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.report:first-of-type{border-top:0}.date{font-weight:700}.muted{color:var(--muted);font-size:14px}.pill{font-size:12px;padding:5px 9px;background:#eef2ff;border-radius:999px;color:#3730a3;white-space:nowrap}
    footer{color:var(--muted);font-size:13px;text-align:center;margin-top:26px}@media(max-width:520px){h1{font-size:26px}.hero{padding:24px 18px}.card{padding:16px}.report{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>每日晨報</h1>
      <p class="sub">Daily Market Report · 美股、半導體、AI 基建與宏觀市場追蹤</p>
    </section>

    <section class="card">
      <h2>今日晨報</h2>
      <p class="muted">網站架構已建立。之後每天的晨報會以手機友善 HTML 保存，並從這裡進入。</p>
    </section>

    <section class="card">
      <h2>歷史晨報</h2>
      <div class="report">
        <div><div class="date">2026 年 9 月</div><div class="muted">每日報告歸檔</div></div>
        <a class="pill" href="reports/2026/09/index.html">查看月份 →</a>
      </div>
    </section>

    <footer>CharlesSunDATA · Daily Market Report</footer>
  </main>
</body>
</html>
