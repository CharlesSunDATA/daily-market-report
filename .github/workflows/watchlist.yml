name: Update Watchlist Signals
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-watchlist-signals
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan sources
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            python scripts/update_watchlist.py --adelaide-9am
          else
            python scripts/update_watchlist.py
          fi
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist-signals.json watchlist-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update watchlist signals and scan status"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy latest pages
        uses: actions/deploy-pages@v4
