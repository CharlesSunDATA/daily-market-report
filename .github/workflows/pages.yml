name: Deploy Pages
# deployment trigger 2026-09-20

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate calendar logic and browser JavaScript
        run: |
          python -m unittest discover -s tests -v
          node --check weekly-calendar.js

      - name: Add weekly calendar cards to the newest published report
        run: python scripts/inject_calendar.py

      - name: Pre-render earnings and economic events into both pages
        run: |
          python scripts/render_calendar.py
          python - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          assert 'id="weeklyEarnings">讀取中' not in page
          assert 'id="weeklyMacro">讀取中' not in page
          assert 'calEvent' in page
          print('Page smoke test: both weekly cards show data without JavaScript')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
