name: Refresh Weekly Market Calendar
on:
  # Kick off a real refresh on fixes, in addition to daily cron.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/calendar.yml"
      - "scripts/update_weekly_calendar.py"
      - "tests/test_weekly_calendar.py"
      - "weekly-calendar.js"
  schedule:
    # Two DST-safe slots. The updater deduplicates successful scans by local day;
    # GitHub Actions runs can start late, so don't enforce a 9 AM wall-clock gate.
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-weekly-market-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate calendar transforms and JavaScript syntax
        run: |
          python -m unittest discover -s tests -v
          node --check weekly-calendar.js
      - name: Refresh Nasdaq and BLS sources
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            python scripts/update_weekly_calendar.py --once-per-local-day
          else
            python scripts/update_weekly_calendar.py
          fi
      - name: Commit calendar data with conflict-safe retries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add weekly-calendar.json weekly-calendar-status.json
            if git diff --cached --quiet; then
              echo "Calendar unchanged"
              exit 0
            fi
            git commit -m "Refresh weekly earnings and economic events"
            if git push origin HEAD:main; then
              echo "Calendar data published"
              exit 0
            fi
            echo "main advanced while scanning; recomputing on newest commit (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_weekly_calendar.py
          done
          echo "Calendar push could not be completed after retries" >&2
          exit 1
