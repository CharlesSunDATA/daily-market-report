name: Refresh Weekly Market Calendar
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-weekly-market-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local source transformations
        run: python -m unittest discover -s tests -v
      - name: Refresh Nasdaq and BLS sources
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            python scripts/update_weekly_calendar.py --adelaide-9am
          else
            python scripts/update_weekly_calendar.py
          fi
      - name: Commit calendar data only when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-calendar.json weekly-calendar-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh weekly earnings and economic events"
          git push
